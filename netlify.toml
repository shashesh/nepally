[build]
  # Stay at repo root so npm workspaces resolve correctly
  base = "/"
  # Build shared package first (needed for transpilePackages), then web
  command = "npm run build --workspace=packages/shared && npm run build --workspace=apps/web"
  # Next.js output directory relative to repo root
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* keys are intentionally bundled into client-side JS by Next.js.
  # Without this, Netlify secrets scanning flags them as false positives.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY"

# Disable Netlify's own CI builds on PRs — CI is handled by GitHub Actions.
# Remove this block if you want Netlify deploy previews on pull requests.
[context.deploy-preview]
  command = "echo 'Preview builds disabled — CI handled by GitHub Actions'"

[[plugins]]
  package = "@netlify/plugin-nextjs"
