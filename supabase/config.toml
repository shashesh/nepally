# Supabase Project Configuration
# Reference: https://supabase.com/docs/guides/cli/config

project_id = "your-project-id"

[api]
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in these schemas will get API endpoints.
schemas = ["public", "storage", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returned from a view, table, or stored procedure.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# The database major version to use. This must be the same as your remote database.
major_version = 15

[studio]
# Port to use for Supabase Studio.
port = 54323

[inbucket]
# Port to use for the email testing server (inbucket).
port = 54324

[storage]
# The maximum file size allowed (in megabytes).
file_size_limit = 50

[auth]
# The base URL for your website. Used for OAuth redirects and email links.
site_url = "http://localhost:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to after authentication.
additional_redirect_urls = ["http://localhost:8081", "myapp://"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour).
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
enable_signup = true

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = true
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false

# External OAuth providers
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[auth.external.facebook]
enabled = false
client_id = ""
secret = ""

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

# Realtime configuration
[realtime]
# Bind realtime via either IPv4 or IPv6. (default: IPv6)
# ip_version = "IPv6"

# Edge Functions configuration
[functions]
# If you want to use a bundler other than esbuild.
# bundler = "esbuild"

[functions.send-push-notification]
verify_jwt = true

# Auth rate limits
[auth.rate_limit]
# Number of requests allowed per minute for password recovery endpoints
password_recovery = 10
# Number of requests allowed per minute for token refresh endpoints
token_refresh = 100
# Number of requests allowed per minute for OTP verification endpoints
otp_verification = 30

# Database extensions
[db.extensions]
# Enable or disable specific database extensions
# pgcrypto = true
# pg_stat_statements = true
# uuid-ossp = true
