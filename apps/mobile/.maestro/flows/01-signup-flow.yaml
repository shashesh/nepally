appId: us.nepally.app
---
# Full signup → onboarding → HomeScreen
- launchApp:
    clearState: true

# WelcomeScreen
- assertVisible: "Sign Up"
- tapOn: "Sign Up"

# SignupMethodScreen
- assertVisible: "Continue with Email"
- tapOn: "Continue with Email"

# EmailSignupScreen (signup mode)
- assertVisible: "Sign up with your email"
- tapOn:
    text: "Full Name"
- inputText: "E2E Test User"
- tapOn:
    text: "Email"
- inputText: "e2e-test@nusa.app"
- tapOn:
    text: "Password"
- inputText: "Password123!"
- tapOn:
    text: "Confirm Password"
- inputText: "Password123!"
- tapOn: "Sign Up"

# ZipCodeEntryScreen
- assertVisible: "Continue"
- tapOn:
    id: "zip-code-input"
- inputText: "10001"
- tapOn: "Continue"

# MetroConfirmationScreen
- assertVisible: "Continue"
- tapOn: "Continue"

# HomeScreen (feed)
- assertVisible:
    id: "create-post-fab"
