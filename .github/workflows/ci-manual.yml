name: CI Manual

# Mirrors ci.yml's static checks, unit tests and web E2E jobs for any branch.

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to run the full CI pipeline on
        required: true
        default: master

jobs:
  static_checks:
    name: Static checks
    uses: ./.github/workflows/ci-job.yml
    with:
      ref: ${{ github.event.inputs.target_branch }}
      command: |
        status=0
        npm run lint || status=1
        npm run lint:guards || status=1
        npm run type-check || status=1
        exit $status

  unit_tests:
    name: Unit tests
    uses: ./.github/workflows/ci-job.yml
    with:
      ref: ${{ github.event.inputs.target_branch }}
      command: npm run test:coverage:ci

  web_e2e:
    name: Web E2E tests
    uses: ./.github/workflows/ci-job.yml
    with:
      ref: ${{ github.event.inputs.target_branch }}
      command: npm run test:e2e --workspace=apps/web
      install_playwright: true
      with_supabase_env: true
    secrets: inherit
