name: Docs

# Reuses ci-job.yml so Node version, npm caching, and timeout policy stay in one
# place. The path filter lives here because it is the only part the reusable
# workflow cannot express. It must keep covering every path ci.yml ignores, so
# docs-only changes are still checked (scripts/ci/prod-deploy-guard.test.js checks).
# Draft PRs are skipped until marked ready for review, and converting back to draft
# cancels the run in flight, like CI.

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - master
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/docs/**'

concurrency:
  group: docs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  docs_check:
    name: Docs check
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-job.yml
    with:
      # One job, not two: each job is billed as at least a full minute.
      command: |
        status=0
        npm run docs:test || status=1
        npm run docs:check || status=1
        npm run lint:md || status=1
        exit $status
