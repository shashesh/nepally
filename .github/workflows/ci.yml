name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Lint, Typecheck, Test, Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint guards
        run: npm run lint:guards

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npm exec --workspace=apps/web playwright install --with-deps

      - name: Web E2E tests
        run: npm run test:e2e --workspace=apps/web
