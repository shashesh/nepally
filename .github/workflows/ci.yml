name: CI

# GitHub Actions minutes are scarce, so CI only spends them on code that is ready to merge:
# - Docs-only changes never start this workflow. The Docs workflow checks them.
# - Draft PRs start it, but every job is skipped until the PR is marked ready for review.
#   Converting a PR back to draft starts a skipped run that cancels the one in flight.
# Why: docs/decisions/2026-09-19-ci-actions-minute-budget.md

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    # Keep both lists equal to DOCS_ONLY_PATHS in scripts/ci/prod-deploy-guard.js; its test checks.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Lets the production guard's advice work: run CI on master's head when it has no run.
  workflow_dispatch:

concurrency:
  # One run per PR: a new push cancels the run it made obsolete. Master pushes group
  # by commit, so every merge keeps its own run for the dev deploy and the prod guard.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  static_checks:
    name: Static checks
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-job.yml
    with:
      # Run every check even when one fails, so a single run reports every problem.
      command: |
        status=0
        npm run lint || status=1
        npm run lint:guards || status=1
        npm run type-check || status=1
        exit $status

  unit_tests:
    name: Unit tests
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-job.yml
    with:
      # Same tests as test:ci plus coverage, so one job covers both.
      command: npm run test:coverage:ci

  web_e2e:
    name: Web E2E tests
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-job.yml
    with:
      command: npm run test:e2e --workspace=apps/web
      install_playwright: true
      with_supabase_env: true
    secrets: inherit

  web_visual:
    name: Web visual regression
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep this tag equal to the installed @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run visual tests
        working-directory: apps/web
        run: npx playwright test --project=visual-desktop --project=visual-phone
        env:
          CI: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          # Keep equal to VISUAL_NOW_ISO in apps/web/e2e/visual/helpers.ts, which asserts it.
          E2E_FIXED_NOW: '2026-09-14T12:00:00Z'

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/web/test-results
