name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest

    steps:
      - name: Confirm CI trigger
        run: echo "CI triggered by ${{ github.event_name }} on ${{ github.ref_name }}. Running CI jobs."

  lint:
    name: Lint
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run lint

  lint_guards:
    name: Lint guards
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run lint:guards

  type_check:
    name: Type check
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run type-check

  unit_tests:
    name: Unit tests
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run test:ci

  coverage:
    name: Coverage
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run test:coverage:ci

  web_e2e:
    name: Web E2E tests
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run test:e2e --workspace=apps/web
      install_playwright: true
      with_supabase_env: true
    secrets: inherit
