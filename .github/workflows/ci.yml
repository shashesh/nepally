name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest

    steps:
      - name: Confirm CI trigger
        run: echo "CI triggered by ${{ github.event_name }} on ${{ github.ref_name }}. Running CI jobs."

  lint:
    name: Lint
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run lint

  lint_guards:
    name: Lint guards
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run lint:guards

  type_check:
    name: Type check
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run type-check

  unit_tests:
    name: Unit tests
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run test:ci

  coverage:
    name: Coverage
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run test:coverage:ci

  web_e2e:
    name: Web E2E tests
    uses: ./.github/workflows/ci-job.yml
    needs:
      - gate
    with:
      command: npm run test:e2e --workspace=apps/web
      install_playwright: true
      with_supabase_env: true
    secrets: inherit

  web_visual:
    name: Web visual regression
    needs:
      - gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep this tag equal to the installed @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run visual tests
        working-directory: apps/web
        run: npx playwright test --project=visual-desktop --project=visual-phone
        env:
          CI: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/web/test-results
