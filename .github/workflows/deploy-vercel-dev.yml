name: Deploy Web Dev (Vercel)

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: vercel-dev-deploy
  cancel-in-progress: true

jobs:
  deploy_dev:
    name: Deploy to Vercel Dev
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifact
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel preview
        id: deploy
        run: |
          deployment_url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes | tail -n 1)
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          {
            echo "## Vercel Dev Deployment"
            echo ""
            echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "- Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- CI Run: ${{ github.event.workflow_run.html_url }}"
            echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
