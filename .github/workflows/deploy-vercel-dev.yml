name: Deploy Web Dev (Vercel)

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: vercel-dev-deploy
  cancel-in-progress: true

jobs:
  deploy_dev:
    name: Deploy to Vercel Dev
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check for web-relevant changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- apps/web/ packages/shared/ package.json package-lock.json)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No web-relevant changes detected — skipping deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Web-relevant changes detected:"
            echo "$CHANGED"
          fi

      - name: Setup Node
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.skip != 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.changes.outputs.skip != 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (preview)
        if: steps.changes.outputs.skip != 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifact
        if: steps.changes.outputs.skip != 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel preview
        if: steps.changes.outputs.skip != 'true'
        id: deploy
        run: |
          deployment_url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes | tail -n 1)
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        if: steps.changes.outputs.skip != 'true'
        run: |
          {
            echo "## Vercel Dev Deployment"
            echo ""
            echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "- Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- CI Run: ${{ github.event.workflow_run.html_url }}"
            echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
