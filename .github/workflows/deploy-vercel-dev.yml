name: Deploy Web Dev (Vercel)

on:
  push:
    branches:
      - master
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-vercel-dev.yml'
      - '.github/workflows/deploy-vercel-prod.yml'

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: vercel-dev-deploy
  cancel-in-progress: true

jobs:
  deploy_dev:
    name: Deploy to Vercel Dev
    runs-on: ubuntu-latest
    environment: dev

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Guard - merged PR + required checks
        uses: actions/github-script@v7
        with:
          script: |
            const requiredChecks = [
              'PR gate',
              'Lint',
              'Lint guards',
              'Type check',
              'Unit tests',
              'Coverage',
              'Web E2E tests',
            ];

            const { owner, repo } = context.repo;
            const commitSha = context.sha;

            const pullsResponse = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commitSha,
            });

            const mergedPulls = pullsResponse.data.filter((pr) => Boolean(pr.merged_at));
            if (mergedPulls.length === 0) {
              core.setFailed(`Commit ${commitSha} is not associated with a merged pull request.`);
              return;
            }

            const checksResponse = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: commitSha,
              per_page: 100,
            });

            const latestRunByName = new Map();
            for (const run of checksResponse.data.check_runs) {
              if (!requiredChecks.includes(run.name)) continue;
              const existing = latestRunByName.get(run.name);
              const existingCompletedAt = existing?.completed_at ? Date.parse(existing.completed_at) : 0;
              const runCompletedAt = run.completed_at ? Date.parse(run.completed_at) : 0;
              if (!existing || runCompletedAt >= existingCompletedAt) {
                latestRunByName.set(run.name, run);
              }
            }

            const missingChecks = requiredChecks.filter((name) => !latestRunByName.has(name));
            if (missingChecks.length > 0) {
              core.setFailed(`Missing required checks on ${commitSha}: ${missingChecks.join(', ')}`);
              return;
            }

            const failingChecks = requiredChecks.filter((name) => latestRunByName.get(name).conclusion !== 'success');
            if (failingChecks.length > 0) {
              const details = failingChecks
                .map((name) => `${name}=${latestRunByName.get(name).conclusion}`)
                .join(', ');
              core.setFailed(`Required checks not successful on ${commitSha}: ${details}`);
              return;
            }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment (preview)
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build Vercel artifact
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy to Vercel preview
        id: deploy
        run: |
          deployment_url=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes | tail -n 1)
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Deployment summary
        run: |
          {
            echo "## Vercel Dev Deployment"
            echo ""
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
