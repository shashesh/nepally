name: Preview Deploy (Vercel)

on:
  pull_request:
    branches:
      - master
    # Drafts are skipped; the preview deploys once the PR is marked ready for review.
    # converted_to_draft starts a skipped run that cancels a deploy still in flight.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deploy
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # A healthy deploy takes ~2 min; one hung Vercel upload once billed 34.
    timeout-minutes: 10
    environment: dev

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifact
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel preview
        id: deploy
        run: |
          deployment_url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes | tail -n 1)
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview-comment -->';
            const body = [
              marker,
              '## Vercel Preview Deployment',
              '',
              `**Preview URL:** ${{ steps.deploy.outputs.deployment_url }}`,
              `**Commit:** \`${context.sha.slice(0, 7)}\``,
              `**Branch:** \`${context.payload.pull_request.head.ref}\``,
            ].join('\n');

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Find existing preview comment to update instead of spamming
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.data.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
