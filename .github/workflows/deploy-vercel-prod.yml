name: Deploy Web Production (Vercel)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: false

jobs:
  deploy_prod:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    environment: production

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Ensure dispatch target is master
        if: github.ref_name != 'master'
        run: |
          echo "Production workflow can only be run from master."
          echo "Selected ref: ${{ github.ref_name }}"
          exit 1

      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Capture master commit SHA
        id: master_sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard - merged PR + required checks on master
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.master_sha.outputs.value }}
        with:
          script: |
            const requiredChecks = [
              'PR gate',
              'Lint',
              'Lint guards',
              'Type check',
              'Unit tests',
              'Coverage',
              'Web E2E tests',
            ];

            const MAX_ATTEMPTS = 30;
            const POLL_INTERVAL_MS = 20_000; // 20 seconds between polls (~10 min max)

            const { owner, repo } = context.repo;
            const mergeCommitSha = process.env.TARGET_SHA;

            const pullsResponse = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: mergeCommitSha,
            });

            const mergedPulls = pullsResponse.data.filter((pr) => Boolean(pr.merged_at));
            if (mergedPulls.length === 0) {
              core.setFailed(`Latest master commit ${mergeCommitSha} is not associated with a merged pull request.`);
              return;
            }

            // CI checks run on the PR head commit, not the merge commit.
            const prHeadSha = mergedPulls[0].head.sha;
            const commitSha = prHeadSha;
            core.info(`Waiting for CI checks on PR head SHA: ${commitSha}`);

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
              const checksResponse = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: commitSha,
                per_page: 100,
              });

              const latestRunByName = new Map();
              for (const run of checksResponse.data.check_runs) {
                if (!requiredChecks.includes(run.name)) continue;
                const existing = latestRunByName.get(run.name);
                // Use run ID (monotonically increasing) so in-progress reruns
                // always replace older completed runs.
                if (!existing || run.id > existing.id) {
                  latestRunByName.set(run.name, run);
                }
              }

              const missingChecks = requiredChecks.filter((name) => !latestRunByName.has(name));
              const pendingChecks = requiredChecks.filter((name) => {
                const run = latestRunByName.get(name);
                return run && run.status !== 'completed';
              });

              // All checks present and completed — evaluate results
              if (missingChecks.length === 0 && pendingChecks.length === 0) {
                const failingChecks = requiredChecks.filter(
                  (name) => latestRunByName.get(name).conclusion !== 'success',
                );
                if (failingChecks.length > 0) {
                  const details = failingChecks
                    .map((name) => `${name}=${latestRunByName.get(name).conclusion}`)
                    .join(', ');
                  core.setFailed(`Required checks not successful on ${commitSha}: ${details}`);
                  return;
                }
                core.info(`All required checks passed on ${commitSha}.`);
                return;
              }

              // Still waiting — log and retry
              const waiting = [...missingChecks.map((n) => `${n} (missing)`), ...pendingChecks.map((n) => `${n} (in progress)`)];
              core.info(`Attempt ${attempt}/${MAX_ATTEMPTS}: waiting for: ${waiting.join(', ')}`);

              if (attempt < MAX_ATTEMPTS) {
                await sleep(POLL_INTERVAL_MS);
              }
            }

            core.setFailed(`Timed out waiting for CI checks on ${commitSha} after ${MAX_ATTEMPTS} attempts.`);

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        id: deploy
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes | tail -n 1)
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          {
            echo "## Vercel Production Deployment"
            echo ""
            echo "- Branch: master"
            echo "- Commit: ${{ steps.master_sha.outputs.value }}"
            echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
