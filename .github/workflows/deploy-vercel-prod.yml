name: Deploy Web Production (Vercel)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: false

jobs:
  deploy_prod:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Ensure dispatch target is master
        if: github.ref_name != 'master'
        run: |
          echo "Production workflow can only be run from master."
          echo "Selected ref: ${{ github.ref_name }}"
          exit 1

      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Capture master commit SHA
        id: master_sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard - CI must have passed on master
        # CI skips docs-only commits, so the head may have no run of its own. The
        # rules, and their tests, live in scripts/ci/prod-deploy-guard.js.
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.master_sha.outputs.value }}
        with:
          script: |
            const { run } = require('./scripts/ci/prod-deploy-guard.js');
            await run({ github, context, core, headSha: process.env.TARGET_SHA });

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        id: deploy
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes | tail -n 1)
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          {
            echo "## Vercel Production Deployment"
            echo ""
            echo "- Branch: master"
            echo "- Commit: ${{ steps.master_sha.outputs.value }}"
            echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
