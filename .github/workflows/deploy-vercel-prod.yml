name: Deploy Web Production (Vercel)

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: false

jobs:
  deploy_prod:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    environment: production

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Ensure dispatch target is master
        if: github.ref_name != 'master'
        run: |
          echo "Production workflow can only be run from master."
          echo "Selected ref: ${{ github.ref_name }}"
          exit 1

      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Capture master commit SHA
        id: master_sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard - CI must have passed on master
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.master_sha.outputs.value }}
        with:
          script: |
            const requiredChecks = [
              'PR gate',
              'Lint',
              'Lint guards',
              'Type check',
              'Unit tests',
              'Coverage',
              'Web E2E tests',
            ];

            const { owner, repo } = context.repo;
            const commitSha = process.env.TARGET_SHA;

            // CI now runs on push to master, so checks exist on the merge commit itself.
            const checksResponse = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: commitSha,
              per_page: 100,
            });

            const latestRunByName = new Map();
            for (const run of checksResponse.data.check_runs) {
              if (!requiredChecks.includes(run.name)) continue;
              const existing = latestRunByName.get(run.name);
              if (!existing || run.id > existing.id) {
                latestRunByName.set(run.name, run);
              }
            }

            const missingChecks = requiredChecks.filter((name) => !latestRunByName.has(name));
            if (missingChecks.length > 0) {
              core.setFailed(`Missing required checks on ${commitSha}: ${missingChecks.join(', ')}. Run CI on master first.`);
              return;
            }

            const failingChecks = requiredChecks.filter((name) => {
              const run = latestRunByName.get(name);
              return run.status !== 'completed' || run.conclusion !== 'success';
            });
            if (failingChecks.length > 0) {
              const details = failingChecks
                .map((name) => {
                  const run = latestRunByName.get(name);
                  return `${name}=${run.status === 'completed' ? run.conclusion : run.status}`;
                })
                .join(', ');
              core.setFailed(`Required checks not successful on ${commitSha}: ${details}`);
              return;
            }

            core.info(`All required checks passed on ${commitSha}.`);

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        id: deploy
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes | tail -n 1)
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          {
            echo "## Vercel Production Deployment"
            echo ""
            echo "- Branch: master"
            echo "- Commit: ${{ steps.master_sha.outputs.value }}"
            echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
