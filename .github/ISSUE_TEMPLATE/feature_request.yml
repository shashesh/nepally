name: Feature request
description: Propose new functionality.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a community member not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: Affected surfaces
      options:
        - label: Mobile
        - label: Web
        - label: Shared package
        - label: Database / RLS
  - type: input
    id: phase
    attributes:
      label: Roadmap phase
      description: See docs/product/roadmap.md
  - type: checkboxes
    id: process
    attributes:
      label: Process
      options:
        - label: This is large enough to need a spec in docs/specs/ before implementation
